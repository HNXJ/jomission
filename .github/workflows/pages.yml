name: pages

on:
  push:
    branches: [main, dev, cowork/focused-ptolemy-dz7hwc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build verifies publication-manifest lineage
          # edges against git objects; a shallow clone lacks old SHAs.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build atlas site
        run: python scripts/build_pages.py --out site
      - name: Publish dashboard (regenerated from receipts; not part of build_pages allowlist)
        run: |
          python scripts/build_dashboard.py
          mkdir -p site/dashboard
          cp docs/DASHBOARD.html site/dashboard/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    # Owner ruling Q23 (2026-11-05, OPEN-07): deploy from main only; other branches build and upload only.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
