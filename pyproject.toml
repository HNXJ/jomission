[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jomission"
version = "0.1.0"
description = "Dense laminar omission simulation: V1→V4→FEF→PFC with frozen JaxFNE engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "H N" }]
dependencies = [
    "jax>=0.4.25,<0.11",
    "jaxlib>=0.4.25,<0.11",
    "numpy>=1.24",
    "scipy>=1.10",
    "jaxfne>=0.4.17",
]
keywords = ["neuroscience", "omission", "laminar", "jaxfne", "predictive coding"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff==0.16.2", "matplotlib>=3.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["jomission"]
