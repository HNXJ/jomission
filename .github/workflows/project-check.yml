name: project-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the harness reads git history; a shallow clone breaks sealed-registry checks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"
      - name: Project check (includes tier-0 tests)
        env:
          JOMISSION_REMOTE: https://github.com/HNXJ/jomission.git
        run: |
          . .venv/bin/activate
          python scripts/project_check.py
